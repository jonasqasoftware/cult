services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cult}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cult}
      POSTGRES_DB: ${POSTGRES_DB:-cult}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cult} -d ${POSTGRES_DB:-cult}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
